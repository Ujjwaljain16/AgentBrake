name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Gauntlet (attack scoreboard; fails on any regression)
        run: node dist/bench/gauntlet.js
      - name: Committed Gauntlet results are reproducible
        run: git diff --exit-code bench/results/gauntlet.json bench/results/gauntlet.md

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t agentbrake:ci .
      - name: Smoke test (no command prints usage and exits 1)
        run: |
          set +e
          docker run --rm agentbrake:ci node dist/src/proxy/index.js
          test $? -eq 1

  # Publishes with npm trusted publishing (OIDC): no npm token is stored anywhere. The package's
  # Trusted Publisher on npmjs.com must name this repository and workflow file (ci.yml).
  publish-npm:
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write   # lets npm exchange GitHub's OIDC token for a short-lived publish credential

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: npm with trusted-publishing support (>= 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Check whether this version is already on npm
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "agentbrake@$CURRENT" version >/dev/null 2>&1; then
            echo "publish=false" >> $GITHUB_OUTPUT
            echo "agentbrake@$CURRENT is already published; nothing to do."
          else
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "agentbrake@$CURRENT is not on npm yet; publishing."
          fi

      - name: Publish to npm (trusted publishing, with provenance)
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public

  publish-docker:
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip when Docker Hub credentials are not configured
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set; skipping image publish."

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        if: env.HAS_DOCKERHUB == 'true'
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ujjwaljain16/agentbrake:latest
            ujjwaljain16/agentbrake:${{ steps.meta.outputs.version }}
